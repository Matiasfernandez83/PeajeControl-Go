<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingreso · PeajeControl Go</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='11' fill='%23E30613'/><rect x='6' y='23' width='19' height='11' rx='2' fill='white'/><path d='M25 25h6l5 5v4H25z' fill='white'/><rect x='24' y='14' width='2' height='11' fill='white'/><circle cx='14' cy='35.5' r='3' fill='%23111'/><circle cx='31' cy='35.5' r='3' fill='%23111'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--rojo:#E30613;--lima:#DFFF00;--azul:#3b82f6;--radio-ch:11px;
  --vidrio:rgba(18,24,34,.55);--linea:rgba(255,255,255,.09);--txt:#e8edf5;--txt2:#9aa6b8;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;font-feature-settings:'tnum';-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 760px at 82% 16%,#1c2636 0%,transparent 60%),
  radial-gradient(900px 700px at 15% 88%,#141b29 0%,transparent 55%),linear-gradient(135deg,#0a0d12,#0d1119 60%,#0a0e15);
  color:var(--txt);min-height:100vh;display:flex;align-items:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(7%,env(safe-area-inset-left,0px));overflow:auto}
#net{position:fixed;inset:0;z-index:0;display:block;pointer-events:none}
.caja{position:relative;z-index:2;width:100%;max-width:380px;background:var(--vidrio);
  backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);
  border:1px solid var(--linea);border-radius:20px;padding:34px 32px;
  box-shadow:0 30px 90px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06)}
.wm{display:flex;align-items:center;gap:11px;margin-bottom:24px}
.wm-ico{width:46px;height:46px;flex-shrink:0}
/* Marca: se conserva tal cual (texto en blanco sobre fondo oscuro) */
.wm-stack{display:flex;flex-direction:column;line-height:.86;font-weight:800;color:#fff;letter-spacing:.4px;
  font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
.wm-stack div{font-size:22px}
.wm-go{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:900;font-style:italic;
  color:#E30613;letter-spacing:-1px;line-height:.9}
.wm-go b{font-size:24px;vertical-align:top;font-style:normal}
h1{font-weight:700;letter-spacing:-.02em;font-size:23px;margin-bottom:4px;color:#fff}
p{color:var(--txt2);font-size:13px;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--txt2);margin-bottom:7px}
input{width:100%;height:44px;padding:0 14px;border:1px solid var(--linea);border-radius:var(--radio-ch);
  background:rgba(255,255,255,.04);color:var(--txt);font-family:inherit;font-size:14px;margin-bottom:16px;
  transition:border-color .15s,box-shadow .15s,background .15s}
input::placeholder{color:#5f6a7d}
input:focus{outline:0;border-color:var(--azul);box-shadow:0 0 0 3px rgba(59,130,246,.22);background:rgba(255,255,255,.06)}
input:-webkit-autofill{-webkit-text-fill-color:var(--txt);-webkit-box-shadow:0 0 0 40px #18202e inset}
button{width:100%;height:46px;background:var(--rojo);color:#fff;border:0;border-radius:var(--radio-ch);
  font-family:inherit;font-weight:600;font-size:14.5px;cursor:pointer;margin-top:8px;
  box-shadow:0 10px 30px -8px rgba(227,6,19,.55),inset 0 1px 0 rgba(255,255,255,.18);transition:background .15s}
button:hover{background:#c00511}
button:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(227,6,19,.4)}
.err{background:rgba(227,6,19,.12);color:#ffb4ba;border:1px solid rgba(227,6,19,.35);border-radius:var(--radio-ch);
  padding:11px 12px;font-size:13px;margin-bottom:16px}
.clave-wrap{position:relative;width:100%;margin-bottom:16px}
div.clave-wrap input{padding-right:46px;margin:0}
button.ojo{position:absolute;top:0;right:0;bottom:0;width:44px;height:auto;padding:0;margin:0;background:transparent;
  border:0;border-radius:0 var(--radio-ch) var(--radio-ch) 0;color:var(--txt2);cursor:pointer;display:flex;
  align-items:center;justify-content:center;box-shadow:none}
button.ojo:hover,button.ojo:focus-visible{background:transparent;color:var(--lima);box-shadow:none;outline:0}
button.ojo svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.ojo .o-cerrado,button.ojo.ver .o-abierto{display:none}
button.ojo.ver .o-cerrado{display:block}
@media(max-width:560px){body{justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .caja{padding:26px 20px}input{font-size:16px}}
</style>
</head>
<body>
<canvas id="net" aria-hidden="true"></canvas>
<form class="caja" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="wm">
    <svg class="wm-ico" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-label="PeajesControl Go">
      <defs>
        <linearGradient id="pcbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3d4a"/><stop offset="1" stop-color="#bd040f"/></linearGradient>
        <linearGradient id="pcbo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d3d8e0"/></linearGradient>
        <linearGradient id="pcca" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c8ced7"/></linearGradient>
        <linearGradient id="pcgl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#53617a"/><stop offset="1" stop-color="#2b3546"/></linearGradient>
        <linearGradient id="pcch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0f3"/><stop offset=".5" stop-color="#aab0ba"/><stop offset="1" stop-color="#7c828d"/></linearGradient>
        <radialGradient id="pcty" cx="0.5" cy="0.4" r="0.62"><stop offset="0.48" stop-color="#3a3f47"/><stop offset="0.6" stop-color="#14171c"/><stop offset="1" stop-color="#090b0e"/></radialGradient>
      </defs>
      <rect width="48" height="48" rx="12" fill="url(#pcbg)"/>
      <path d="M0 12 A12 12 0 0 1 12 0 H36 A12 12 0 0 1 48 12 V15.5 Q24 8 0 15.5 Z" fill="#fff" opacity="0.13"/>
      <ellipse cx="24" cy="38.7" rx="18.5" ry="1.7" fill="#000" opacity="0.20"/>
      <rect x="4.5" y="17.5" width="20.5" height="16.5" rx="1.8" fill="url(#pcbo)" stroke="#bcc2cc" stroke-width="0.3"/>
      <rect x="5.8" y="19" width="18" height="1.5" rx="0.7" fill="#f2f4f7"/>
      <rect x="24.7" y="12.5" width="1.9" height="14" rx="0.7" fill="url(#pcch)"/>
      <path d="M26.4 17.6 h5.5 c1.1 0 2 .9 2 2 V34 h-7.5 z" fill="url(#pcca)" stroke="#bcc2cc" stroke-width="0.3"/>
      <path d="M27.4 19 h4 c.6 0 1 .45 1 1 V24.2 h-5 z" fill="url(#pcgl)"/>
      <rect x="26.6" y="25" width="7.2" height="0.5" fill="#b7bdc7" opacity="0.8"/>
      <path d="M33.7 24.5 h4.6 c.9 0 1.7 .5 2.1 1.3 l1 2.1 c.2 .45 .35 .95 .35 1.45 V34 h-8 z" fill="url(#pcca)" stroke="#bcc2cc" stroke-width="0.3"/>
      <rect x="40.4" y="27.4" width="1.7" height="5.6" rx="0.4" fill="url(#pcch)"/>
      <rect x="34.4" y="33.2" width="7.8" height="1.5" rx="0.5" fill="url(#pcch)"/>
      <circle cx="40.2" cy="31.6" r="1" fill="#ffe6a0"/>
      <circle cx="10" cy="35.4" r="3.3" fill="url(#pcty)"/><circle cx="10" cy="35.4" r="1.25" fill="#dfe3e8"/>
      <circle cx="16.6" cy="35.4" r="3.3" fill="url(#pcty)"/><circle cx="16.6" cy="35.4" r="1.25" fill="#dfe3e8"/>
      <circle cx="29.6" cy="35.6" r="3.4" fill="url(#pcty)"/><circle cx="29.6" cy="35.6" r="1.3" fill="#dfe3e8"/>
      <circle cx="38.4" cy="35.8" r="2.9" fill="url(#pcty)"/><circle cx="38.4" cy="35.8" r="1.1" fill="#dfe3e8"/>
    </svg>
    <div class="wm-stack"><div>Peajes</div><div>Control</div></div>
    <div class="wm-go"><b>+</b>GO</div>
  </div>
  <h1>Iniciar sesión</h1>
  <p>Control de peajes y gastos de flota</p>
  {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}<div class="err">{{ m }}</div>{% endfor %}
  {% endwith %}
  <label>Correo</label>
  <input type="email" name="email" required autofocus placeholder="tu@email.com">
  <label>Clave</label>
  <div class="clave-wrap"><input type="password" name="clave" required>{% include "_ojo.html" %}</div>
  <button type="submit">Ingresar</button>
</form>
<script>
function verClave(btn){var i=btn.parentNode.querySelector('input'),m=i.type==='password';
  i.type=m?'text':'password';btn.classList.toggle('ver',m);btn.setAttribute('aria-pressed',m);
  btn.setAttribute('aria-label',m?'Ocultar clave':'Mostrar clave');}
</script>
<script>
(function(){
  const cv=document.getElementById('net'), ctx=cv.getContext('2d');
  let W,H,DPR, nodes=[], trail=[];
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const COL={base:[150,170,200], rojo:[227,6,19], lima:[223,255,0], azul:[59,130,246]};
  const mouse={x:-999,y:-999,on:false};

  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=cv.width=Math.floor(innerWidth*DPR);
    H=cv.height=Math.floor(innerHeight*DPR);
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
    const area=innerWidth*innerHeight;
    const target=Math.min(140, Math.max(46, Math.round(area/13000)));
    nodes=[];
    for(let i=0;i<target;i++){
      nodes.push({x:Math.random()*W,y:Math.random()*H,
        vx:(Math.random()-.5)*0.22*DPR, vy:(Math.random()-.5)*0.22*DPR});
    }
  }
  function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}

  function step(){
    ctx.clearRect(0,0,W,H);
    const LINK=145*DPR, MR=190*DPR;
    // update + draw nodes
    for(const n of nodes){
      n.x+=n.vx; n.y+=n.vy;
      if(n.x<0||n.x>W)n.vx*=-1; if(n.y<0||n.y>H)n.vy*=-1;
      // gentle pull toward cursor
      if(mouse.on){
        const dx=mouse.x-n.x, dy=mouse.y-n.y, d=Math.hypot(dx,dy);
        if(d<MR){ const f=(1-d/MR)*0.035; n.vx+=dx/d*f; n.vy+=dy/d*f; }
      }
      // damping + speed cap
      n.vx*=0.995; n.vy*=0.995;
      const sp=Math.hypot(n.vx,n.vy), cap=0.9*DPR;
      if(sp>cap){n.vx=n.vx/sp*cap; n.vy=n.vy/sp*cap;}
    }
    // links node-node
    for(let i=0;i<nodes.length;i++){
      const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){
        const b=nodes[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy);
        if(d<LINK){
          ctx.strokeStyle=rgba(COL.base,(1-d/LINK)*0.16);
          ctx.lineWidth=1*DPR; ctx.beginPath();
          ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }
    // links node-cursor (the "web" that reaches to the mouse)
    if(mouse.on){
      for(const n of nodes){
        const dx=mouse.x-n.x, dy=mouse.y-n.y, d=Math.hypot(dx,dy);
        if(d<MR){
          const t=1-d/MR;
          const c=t>0.55?COL.rojo:(t>0.3?COL.lima:COL.azul);
          ctx.strokeStyle=rgba(c,t*0.5);
          ctx.lineWidth=1.1*DPR; ctx.beginPath();
          ctx.moveTo(mouse.x,mouse.y); ctx.lineTo(n.x,n.y); ctx.stroke();
        }
      }
    }
    // nodes
    for(const n of nodes){
      let near=0;
      if(mouse.on){const d=Math.hypot(mouse.x-n.x,mouse.y-n.y); near=d<MR?1-d/MR:0;}
      const r=(1.5+near*1.6)*DPR;
      ctx.fillStyle=near>0.5?rgba(COL.rojo,.9):rgba(COL.base,.5+near*.4);
      ctx.beginPath(); ctx.arc(n.x,n.y,r,0,7); ctx.fill();
    }
    // cursor comet trail (the drag effect)
    if(trail.length>1){
      for(let i=1;i<trail.length;i++){
        const p=trail[i-1], q=trail[i], t=i/trail.length;
        ctx.strokeStyle=rgba(COL.rojo, t*0.5);
        ctx.lineWidth=(0.5+t*3.5)*DPR; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
      }
    }
    if(mouse.on){
      const g=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,26*DPR);
      g.addColorStop(0,rgba(COL.lima,.55)); g.addColorStop(1,rgba(COL.lima,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(mouse.x,mouse.y,26*DPR,0,7); ctx.fill();
    }
    // fade trail
    if(trail.length>22) trail.shift();
    raf=requestAnimationFrame(step);
  }

  function setMouse(x,y){ mouse.x=x*DPR; mouse.y=y*DPR; mouse.on=true; trail.push({x:mouse.x,y:mouse.y}); }
  addEventListener('mousemove',e=>setMouse(e.clientX,e.clientY));
  addEventListener('mouseleave',()=>{mouse.on=false;trail=[];});
  addEventListener('touchmove',e=>{const t=e.touches[0]; if(t) setMouse(t.clientX,t.clientY);},{passive:true});
  addEventListener('resize',resize);

  let raf; resize();
  if(reduce){ mouse.on=false; step(); cancelAnimationFrame(raf); }
  else {
    step();
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){ cancelAnimationFrame(raf); }
      else { cancelAnimationFrame(raf); raf=requestAnimationFrame(step); }
    });
  }
})();
</script>
</body>
</html>
