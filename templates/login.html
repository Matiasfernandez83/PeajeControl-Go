<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingreso · PeajeControl Go</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='11' fill='%23E30613'/><rect x='6' y='23' width='19' height='11' rx='2' fill='white'/><path d='M25 25h6l5 5v4H25z' fill='white'/><rect x='24' y='14' width='2' height='11' fill='white'/><circle cx='14' cy='35.5' r='3' fill='%23111'/><circle cx='31' cy='35.5' r='3' fill='%23111'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--radio:12px;--radio-ch:8px;
  --sombra:0 1px 2px rgba(20,20,20,.04), 0 8px 24px -12px rgba(20,20,20,.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;font-feature-settings:'tnum';background:#141414;color:#141414;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;-webkit-font-smoothing:antialiased}
.caja{background:#fff;border:1px solid #e4e4e7;border-radius:var(--radio);box-shadow:var(--sombra);padding:32px;width:100%;max-width:400px}
.wm{display:flex;align-items:center;gap:11px;margin-bottom:24px}
.wm-ico{width:46px;height:46px;flex-shrink:0}
/* Marca: se conserva tal cual */
.wm-stack{display:flex;flex-direction:column;line-height:.86;font-weight:800;color:#141414;letter-spacing:.4px;
  font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
.wm-stack div{font-size:22px}
.wm-go{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:900;font-style:italic;
  color:#E30613;letter-spacing:-1px;line-height:.9}
.wm-go b{font-size:24px;vertical-align:top;font-style:normal}
h1{font-weight:700;letter-spacing:-.02em;font-size:22px;margin-bottom:4px}
p{color:#71717a;font-size:13.5px;margin-bottom:24px}
label{display:block;font-size:13px;font-weight:500;color:#3f3f46;margin-bottom:6px}
input{width:100%;height:40px;padding:0 12px;border:1px solid #d4d4d8;border-radius:var(--radio-ch);font-family:inherit;
  font-size:14px;margin-bottom:16px;transition:border-color .15s,box-shadow .15s}
input:focus{outline:0;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
button{width:100%;height:40px;background:#E30613;color:#fff;border:0;border-radius:var(--radio-ch);
  font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;margin-top:4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15);transition:background .15s}
button:hover{background:#c00511}
button:focus-visible{outline:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 0 3px rgba(227,6,19,.25)}
.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:var(--radio-ch);padding:11px 12px;
  font-size:13px;margin-bottom:16px}
.clave-wrap{position:relative;width:100%}
div.clave-wrap input{padding-right:44px;margin:0}
.clave-wrap{margin-bottom:16px}
button.ojo{position:absolute;top:0;right:0;bottom:0;width:42px;height:auto;padding:0;margin:0;background:transparent;
  border:0;border-radius:0 var(--radio-ch) var(--radio-ch) 0;color:#71717a;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:none}
button.ojo:hover,button.ojo:focus-visible{background:transparent;color:#E30613;box-shadow:none;outline:0}
button.ojo svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.ojo .o-cerrado,button.ojo.ver .o-abierto{display:none}
button.ojo.ver .o-cerrado{display:block}
@media(max-width:480px){.caja{padding:24px 20px}input,button{height:44px}input{font-size:16px}}
</style>
</head>
<body>
<form class="caja" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="wm">
    <svg class="wm-ico" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-label="PeajesControl Go">
      <defs>
        <linearGradient id="pcbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3d4a"/><stop offset="1" stop-color="#bd040f"/></linearGradient>
        <linearGradient id="pcbo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d3d8e0"/></linearGradient>
        <linearGradient id="pcca" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c8ced7"/></linearGradient>
        <linearGradient id="pcgl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#53617a"/><stop offset="1" stop-color="#2b3546"/></linearGradient>
        <linearGradient id="pcch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0f3"/><stop offset=".5" stop-color="#aab0ba"/><stop offset="1" stop-color="#7c828d"/></linearGradient>
        <radialGradient id="pcty" cx="0.5" cy="0.4" r="0.62"><stop offset="0.48" stop-color="#3a3f47"/><stop offset="0.6" stop-color="#14171c"/><stop offset="1" stop-color="#090b0e"/></radialGradient>
      </defs>
      <rect width="48" height="48" rx="12" fill="url(#pcbg)"/>
      <path d="M0 12 A12 12 0 0 1 12 0 H36 A12 12 0 0 1 48 12 V15.5 Q24 8 0 15.5 Z" fill="#fff" opacity="0.13"/>
      <ellipse cx="24" cy="38.7" rx="18.5" ry="1.7" fill="#000" opacity="0.20"/>
      <rect x="4.5" y="17.5" width="20.5" height="16.5" rx="1.8" fill="url(#pcbo)" stroke="#bcc2cc" stroke-width="0.3"/>
      <rect x="5.8" y="19" width="18" height="1.5" rx="0.7" fill="#f2f4f7"/>
      <rect x="24.7" y="12.5" width="1.9" height="14" rx="0.7" fill="url(#pcch)"/>
      <path d="M26.4 17.6 h5.5 c1.1 0 2 .9 2 2 V34 h-7.5 z" fill="url(#pcca)" stroke="#bcc2cc" stroke-width="0.3"/>
      <path d="M27.4 19 h4 c.6 0 1 .45 1 1 V24.2 h-5 z" fill="url(#pcgl)"/>
      <rect x="26.6" y="25" width="7.2" height="0.5" fill="#b7bdc7" opacity="0.8"/>
      <path d="M33.7 24.5 h4.6 c.9 0 1.7 .5 2.1 1.3 l1 2.1 c.2 .45 .35 .95 .35 1.45 V34 h-8 z" fill="url(#pcca)" stroke="#bcc2cc" stroke-width="0.3"/>
      <rect x="40.4" y="27.4" width="1.7" height="5.6" rx="0.4" fill="url(#pcch)"/>
      <rect x="34.4" y="33.2" width="7.8" height="1.5" rx="0.5" fill="url(#pcch)"/>
      <circle cx="40.2" cy="31.6" r="1" fill="#ffe6a0"/>
      <circle cx="10" cy="35.4" r="3.3" fill="url(#pcty)"/><circle cx="10" cy="35.4" r="1.25" fill="#dfe3e8"/>
      <circle cx="16.6" cy="35.4" r="3.3" fill="url(#pcty)"/><circle cx="16.6" cy="35.4" r="1.25" fill="#dfe3e8"/>
      <circle cx="29.6" cy="35.6" r="3.4" fill="url(#pcty)"/><circle cx="29.6" cy="35.6" r="1.3" fill="#dfe3e8"/>
      <circle cx="38.4" cy="35.8" r="2.9" fill="url(#pcty)"/><circle cx="38.4" cy="35.8" r="1.1" fill="#dfe3e8"/>
    </svg>
    <div class="wm-stack"><div>Peajes</div><div>Control</div></div>
    <div class="wm-go"><b>+</b>GO</div>
  </div>
  <h1>Iniciar sesión</h1>
  <p>Control de peajes y gastos de flota</p>
  {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}<div class="err">{{ m }}</div>{% endfor %}
  {% endwith %}
  <label>Correo</label>
  <input type="email" name="email" required autofocus placeholder="tu@email.com">
  <label>Clave</label>
  <div class="clave-wrap"><input type="password" name="clave" required>{% include "_ojo.html" %}</div>
  <button type="submit">Ingresar</button>
</form>
<script>
function verClave(btn){var i=btn.parentNode.querySelector('input'),m=i.type==='password';
  i.type=m?'text':'password';btn.classList.toggle('ver',m);btn.setAttribute('aria-pressed',m);
  btn.setAttribute('aria-label',m?'Ocultar clave':'Mostrar clave');}
</script>
</body>
</html>
