<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>{{ titulo }} · PeajeControl Go</title>
{% include "_iconos.html" %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/fuentes.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="err">
<canvas id="net" aria-hidden="true"></canvas>
<main class="caja err-pag">
  <div class="wm">{% include "_marca.html" %}
    <div class="wm-stack"><div>Peajes</div><div>Control</div></div>
    <div class="wm-go"><b>+</b>GO</div>
  </div>
  <div class="cod">{{ codigo }}</div>
  <h1>{{ titulo }}</h1>
  <p>{{ texto }}</p>
  <a class="boton" href="/">Volver al inicio</a>
  {% if codigo == 500 and contacto.whatsapp %}<a class="volver" href="{{ contacto.whatsapp_url }}" target="_blank" rel="noopener">Si sigue pasando, escribinos por WhatsApp</a>{% endif %}
</main>
<script src="{{ url_for('static', filename='js/particulas-login.js') }}" defer></script>
</body>
</html>
