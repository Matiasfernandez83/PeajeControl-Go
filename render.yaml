services:
  - type: web
    name: tags-furlong
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # Conexion PostgreSQL (Supabase, Session pooler). Es un SECRETO: el valor NO va en este
      # archivo. Se carga a mano en el panel de Render (Environment > DATABASE_URL).
      - key: DATABASE_URL
        sync: false
      # Datos de contacto de la landing (publicos). Si no se cargan, la landing muestra datos de ejemplo.
      - key: CONTACTO_EMAIL
        sync: false
      - key: CONTACTO_WHATSAPP   # con codigo de pais, ej. +54 9 11 1234-5678
        sync: false
